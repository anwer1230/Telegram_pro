name: Build Telegram_Anwer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Create keystore file from secret
        run: |
          mkdir -p TMessagesProj/config
          mkdir -p TMessagesProject/config
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore
            cp TMessagesProj/config/release.keystore TMessagesProject/config/release.keystore
          else
            echo "Keystore secret not set, using repository local keystore"
          fi

      - name: Grant execution permission for gradlew
        run: chmod +x gradlew || true

      - name: Install NDK 27.2.12479018
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018"

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || '772997043a**' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'Telegram_Anwer' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || '772997043a**' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew TMessagesProj:assembleRelease || ./gradlew assembleRelease
          else
            echo "Gradle wrapper ready"
          fi

      - name: Upload Telegram_Anwer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram_Anwer_v12.9.2
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
            TMessagesProj/build/outputs/apk/*/*.apk
            TMessagesProject/build/outputs/apk/release/*.apk
